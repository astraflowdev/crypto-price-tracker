<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crypto Price Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Top 10 coins by market cap</h1>
    <p id="updated" aria-live="polite">Loading prices…</p>
    <noscript><p class="status">This page needs JavaScript to load the prices.</p></noscript>
    <p id="status" class="status" role="alert" hidden></p>
    <table>
      <thead>
        <tr><th scope="col">#</th><th scope="col">Coin</th><th scope="col" class="price">Price (USD)</th><th scope="col" class="change">24h</th></tr>
      </thead>
      <tbody id="coins"></tbody>
    </table>
    <section aria-labelledby="add-title">
      <h2 id="add-title">Add a coin</h2>
      <label for="search">Search by name or symbol</label>
      <input id="search" type="search" autocomplete="off" placeholder="For example: dogecoin or DOGE">
      <p id="search-status" aria-live="polite"></p>
      <ul id="results"></ul>
    </section>
    <section id="added-section" aria-labelledby="added-title" hidden>
      <h2 id="added-title">Your coins</h2>
      <table>
        <thead>
          <tr><th scope="col">#</th><th scope="col">Coin</th><th scope="col" class="price">Price (USD)</th><th scope="col" class="change">24h</th><th scope="col"><span class="visually-hidden">Remove</span></th></tr>
        </thead>
        <tbody id="added"></tbody>
      </table>
    </section>
    <p class="source">Data from the <a href="https://www.coingecko.com/" rel="noopener">CoinGecko</a> public API. Prices refresh every 60 seconds. Your coins are saved in this browser.</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
